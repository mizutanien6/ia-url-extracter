<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internet Archive URL Extractor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Internet Archive URL Extractor</h1>

        <div class="form-section">
            <div class="field">
                <label for="userInput">EMAIL ADDRESS OR ITEM URL</label>
                <input type="text" id="userInput" placeholder="user@example.com  or  https://archive.org/details/...">
            </div>

            <div class="field">
                <label for="mediaType">MEDIA TYPE</label>
                <select id="mediaType">
                    <option value="">All</option>
                    <option value="audio">Audio</option>
                    <option value="etree">Etrees</option>
                    <option value="movies">Movies</option>
                    <option value="texts">Texts</option>
                    <option value="software">Software</option>
                    <option value="image">Image</option>
                    <option value="data">Data</option>
                    <option value="web">Web</option>
                </select>
            </div>

            <div class="field checkbox-field">
                <label>
                    <input type="checkbox" id="alsoZip">
                    <span>ALSO OUTPUT ORIGINAL ZIP LINKS <code>(archive.org/compress/…)</code></span>
                </label>
            </div>

            <div class="button-row">
                <button id="startBtn">▶ Extract URLs</button>
                <button id="stopBtn" disabled>■ Stop</button>
            </div>
        </div>

        <div class="status-box">
        <span id="statusMsg">Ready.</span><span id="statusDots"></span><span id="statusCount"></span>
    </div>

        <div class="results-section">
            <div class="results-header">
                <h2>RESULTS</h2>
                <span class="count-badge" id="countBadge">0 items</span>
            </div>
            <textarea id="resultArea" readonly placeholder="URLs will appear here..."></textarea>
            <div class="download-buttons">
                <button id="copyBtn">Copy URLs</button>
                <button id="downloadBtn">⬇ Download .txt</button>
            </div>
        </div>
    </div>

    <script>
        const userInput   = document.getElementById('userInput');
        const mediaType   = document.getElementById('mediaType');
        const alsoZip     = document.getElementById('alsoZip');
        const startBtn    = document.getElementById('startBtn');
        const stopBtn     = document.getElementById('stopBtn');
        const countBadge  = document.getElementById('countBadge');

        // ── Dot animation ──
        const DOT_CHARS = ['', '.',  '..', '...'];
        let dotTimer = null, dotPhase = 0;

        function setMsg(text) { document.getElementById('statusMsg').textContent = text; }
        function startDots() {
            dotPhase = 0;
            document.getElementById('statusDots').textContent = DOT_CHARS[0];
            if (dotTimer) clearInterval(dotTimer);
            dotTimer = setInterval(() => {
                dotPhase = (dotPhase + 1) % 4;
                document.getElementById('statusDots').textContent = DOT_CHARS[dotPhase];
            }, 400);
        }
        function stopDots() {
            if (dotTimer) { clearInterval(dotTimer); dotTimer = null; }
            document.getElementById('statusDots').textContent = '';
        }
        function setCount(text) { document.getElementById('statusCount').textContent = text; }
        const resultArea  = document.getElementById('resultArea');
        const copyBtn     = document.getElementById('copyBtn');
        const downloadBtn = document.getElementById('downloadBtn');

        let isRunning       = false;
        let seenIds         = new Set();
        let detailLines     = [];
        let abortController = null;

        function renderResults() {
            const useZip = alsoZip.checked;
            resultArea.value = detailLines
                .map(u => useZip ? u.replace('/details/', '/compress/') : u)
                .join('\n');
            resultArea.scrollTop = resultArea.scrollHeight;
        }

        alsoZip.addEventListener('change', renderResults);

        startBtn.addEventListener('click', () => {
            if (isRunning) return;
            const input = userInput.value.trim();
            if (!input) { statusText.textContent = 'Please enter an email or item URL.'; return; }
            startFetch(input, mediaType.value);
        });

        stopBtn.addEventListener('click', () => {
            isRunning = false;
            if (abortController) abortController.abort();
            stopDots();
            setMsg(`※ Stopped: ${detailLines.length.toLocaleString()} items collected.`);
            setCount('');
            countBadge.textContent = '0 items';
            startBtn.disabled = false;
            stopBtn.disabled = true;
        });

        copyBtn.addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(resultArea.value);
                const orig = copyBtn.textContent;
                copyBtn.textContent = 'Copied!';
                setTimeout(() => copyBtn.textContent = orig, 1500);
            } catch (err) { alert('Copy failed: ' + err); }
        });

        downloadBtn.addEventListener('click', () => {
            const content = resultArea.value;
            if (!content.trim()) return;
            const blob = new Blob([content], { type: 'text/plain' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = alsoZip.checked ? 'archive_urls_compress.txt' : 'archive_urls.txt';
            a.click();
            URL.revokeObjectURL(a.href);
        });

        async function startFetch(input, mediatype) {
            isRunning = true;
            abortController = new AbortController();
            seenIds.clear();
            detailLines = [];
            resultArea.value = '';
            startBtn.disabled = true;
            stopBtn.disabled = false;
            setMsg('Resolving uploader'); startDots();

            // Step 1: メール解決（1回だけ）
            let email = '';
            try {
                const res  = await fetch(`/resolve?user_input=${encodeURIComponent(input)}`);
                const data = await res.json();
                if (!res.ok || data.error) {
                    stopDots(); setMsg('Error: ' + (data.error || 'resolve failed')); setCount('');
                    startBtn.disabled = false; stopBtn.disabled = true; isRunning = false;
                    return;
                }
                email = data.email;
                userInput.value = email;
            } catch (err) {
                stopDots(); setMsg('Error: ' + err.message); setCount('');
                startBtn.disabled = false; stopBtn.disabled = true; isRunning = false;
                return;
            }

            if (!isRunning) return;

            // Step 2: バッチ取得ループ
            let cursor = null;
            let count  = 0;
            let total  = 0;

            while (isRunning) {
                let url = `/batch?email=${encodeURIComponent(email)}&mediatype=${encodeURIComponent(mediatype)}`;
                if (cursor) url += `&cursor=${encodeURIComponent(cursor)}`;

                try {
                    const res  = await fetch(url, { signal: abortController.signal });
                    const data = await res.json();
                    if (!res.ok || data.error) throw new Error(data.error || 'HTTP ' + res.status);

                    if (total === 0 && data.total) total = data.total;

                    const newLines = [];
                    for (const ident of data.items) {
                        if (!isRunning) break;
                        if (seenIds.has(ident)) continue;
                        seenIds.add(ident);
                        newLines.push(`https://archive.org/details/${ident}`);
                        count++;
                    }

                    if (newLines.length) {
                        detailLines.push(...newLines);
                        renderResults();
                    }

                    const totalStr = total ? total.toLocaleString() : '?';
                    countBadge.textContent = `${count.toLocaleString()} / ${totalStr} items`;
                    setMsg('Fetching'); startDots(); setCount(`${count.toLocaleString()} / ${totalStr}`);

                    if (!data.has_more) {
                        stopDots(); setMsg(`✓ Complete: ${count.toLocaleString()} items`); setCount('');
                        break;
                    }

                    cursor = data.cursor;
                    await new Promise(r => setTimeout(r, 300));

                } catch (err) {
                    if (!isRunning) break;
                    stopDots(); setMsg(`✗ ${err.message}. Retrying in 5s…`); setCount('');
                    await new Promise(r => setTimeout(r, 5000));
                }
            }

            isRunning = false;
            startBtn.disabled = false;
            stopBtn.disabled = true;
            if (document.getElementById('statusMsg').textContent.startsWith('Fetching')) {
                stopDots(); setMsg(`✓ Complete: ${seenIds.size.toLocaleString()} items`); setCount('');
            }
        }
    </script>
</body>
</html>
