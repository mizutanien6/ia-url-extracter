<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA URL Extractor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="card">
            <label for="userInput">EMAIL ADDRESS OR ITEM URL</label>
            <input type="text" id="userInput" placeholder="mizutanien1@gmail.com">

            <label for="mediaType">MEDIA TYPE</label>
            <select id="mediaType">
                <option value="">All</option>
                <option value="audio">Audio</option>
                <option value="etree">Etrees</option>
                <option value="movies">Movies</option>
                <option value="texts">Texts</option>
                <option value="software">Software</option>
                <option value="image">Image</option>
                <option value="data">Data</option>
                <option value="web">Web</option>
            </select>

            <div class="checkbox-row">
                <input type="checkbox" id="alsoZip">
                <label for="alsoZip">ALSO OUTPUT ORIGINAL ZIP LINKS ( archive.org/compress/... )</label>
            </div>

            <div class="button-row">
                <button id="extractBtn" class="btn-primary">▶ Extract URLs</button>
                <button id="stopBtn" class="btn-secondary" disabled>■ Stop</button>
            </div>
        </div>

        <div class="card" id="logCard">
            <div id="statusText">Ready</div>
        </div>

        <div class="card">
            <div class="results-header">
                <h2>RESULTS <span id="countBadge" class="badge">0 items</span></h2>
            </div>
            <textarea id="resultArea" readonly></textarea>
            <div class="button-row">
                <button id="copyBtn" class="btn-action">Copy URLs</button>
                <button id="downloadBtn" class="btn-action">⬇ Download Details .txt</button>
            </div>
        </div>
    </div>

    <script>
        const userInput   = document.getElementById('userInput');
        const mediaType   = document.getElementById('mediaType');
        const alsoZip     = document.getElementById('alsoZip');
        const extractBtn  = document.getElementById('extractBtn');
        const stopBtn     = document.getElementById('stopBtn');
        const statusText  = document.getElementById('statusText');
        const countBadge  = document.getElementById('countBadge');
        const resultArea  = document.getElementById('resultArea');
        const copyBtn     = document.getElementById('copyBtn');
        const downloadBtn = document.getElementById('downloadBtn');

        let isRunning = false;
        let seenIds   = new Set();

        extractBtn.addEventListener('click', () => {
            if (isRunning) return;
            const input = userInput.value.trim();
            if (!input) {
                statusText.textContent = 'Please enter an email or item URL.';
                return;
            }
            startFetch(input, mediaType.value);
        });

        stopBtn.addEventListener('click', () => {
            isRunning = false;
            statusText.textContent = 'Stopped.';
            extractBtn.disabled = false;
            stopBtn.disabled = true;
        });

        copyBtn.addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(resultArea.value);
                const original = copyBtn.textContent;
                copyBtn.textContent = 'Copied!';
                setTimeout(() => copyBtn.textContent = original, 1500);
            } catch (err) {
                alert('Copy failed: ' + err);
            }
        });

        downloadBtn.addEventListener('click', () => {
            const content = resultArea.value;
            if (!content.trim()) return;
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = '/download';
            const c = document.createElement('input');
            c.type = 'hidden'; c.name = 'content'; c.value = content;
            const f = document.createElement('input');
            f.type = 'hidden'; f.name = 'filename';
            f.value = 'archive_urls.txt';
            form.appendChild(c);
            form.appendChild(f);
            document.body.appendChild(form);
            form.submit();
            document.body.removeChild(form);
        });

        async function startFetch(input, mediatype) {
            isRunning = true;
            seenIds.clear();
            resultArea.value = '';
            extractBtn.disabled = true;
            stopBtn.disabled = false;
            statusText.textContent = 'Resolving uploader...';

            // ── Step 1: メール解決（1回だけ）────────────────────────
            let email = '';
            try {
                const res = await fetch(`/resolve?user_input=${encodeURIComponent(input)}`);
                const data = await res.json();
                if (!res.ok || data.error) {
                    statusText.textContent = 'Error: ' + (data.error || 'resolve failed');
                    extractBtn.disabled = false;
                    stopBtn.disabled = true;
                    isRunning = false;
                    return;
                }
                email = data.email;
                userInput.value = email;   // 入力欄をメールで上書き
            } catch (err) {
                statusText.textContent = 'Error: ' + err.message;
                extractBtn.disabled = false;
                stopBtn.disabled = true;
                isRunning = false;
                return;
            }

            if (!isRunning) return;

            // ── Step 2: バッチ取得ループ（emailを直接渡す）──────────
            let cursor = null;
            let count  = 0;
            let total  = 0;

            while (isRunning) {
                let url = `/batch?email=${encodeURIComponent(email)}&mediatype=${encodeURIComponent(mediatype)}`;
                if (cursor) url += `&cursor=${encodeURIComponent(cursor)}`;

                try {
                    const res = await fetch(url);
                    const data = await res.json();

                    if (!res.ok || data.error) {
                        throw new Error(data.error || 'HTTP ' + res.status);
                    }

                    if (total === 0 && data.total) total = data.total;

                    const lines = [];
                    for (const ident of data.items) {
                        if (!isRunning) break;
                        if (seenIds.has(ident)) continue;
                        seenIds.add(ident);

                        const detail   = `https://archive.org/details/${ident}`;
                        const compress = `https://archive.org/compress/${ident}`;
                        lines.push(alsoZip.checked ? detail + '\t' + compress : detail);
                        count++;
                    }

                    if (lines.length) {
                        resultArea.value += (resultArea.value ? '\n' : '') + lines.join('\n');
                    }

                    const totalStr = total ? total.toLocaleString() : '?';
                    countBadge.textContent = `${count.toLocaleString()} / ${totalStr} items`;
                    statusText.textContent = `Fetching... ${count.toLocaleString()} / ${totalStr}`;

                    if (!data.has_more) {
                        statusText.textContent = `Complete: ${count.toLocaleString()} items`;
                        break;
                    }

                    cursor = data.cursor;
                    await new Promise(r => setTimeout(r, 300));

                } catch (err) {
                    if (!isRunning) break;
                    statusText.textContent = `Error: ${err.message}. Retrying in 5s...`;
                    await new Promise(r => setTimeout(r, 5000));
                }
            }

            isRunning = false;
            extractBtn.disabled = false;
            stopBtn.disabled = true;
            if (statusText.textContent.startsWith('Fetching')) {
                statusText.textContent = `Complete: ${seenIds.size.toLocaleString()} items`;
            }
        }
    </script>
</body>
</html>
