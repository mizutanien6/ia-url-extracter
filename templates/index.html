<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internet Archive URL Extractor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Internet Archive URL Extractor</h1>

        <div class="form-section">
            <div class="field">
                <label for="userInput">EMAIL ADDRESS, ITEM URL OR COLLECTION URL</label>
                <input type="text" id="userInput"
                    placeholder="user@example.com  or  https://archive.org/details/…">
            </div>

            <div class="field">
                <label for="mediaType">MEDIA TYPE</label>
                <select id="mediaType">
                    <option value="">All</option>
                    <option value="audio">Audio</option>
                    <option value="etree">Etrees</option>
                    <option value="movies">Movies</option>
                    <option value="texts">Texts</option>
                    <option value="software">Software</option>
                    <option value="image">Image</option>
                    <option value="data">Data</option>
                    <option value="web">Web</option>
                </select>
            </div>

            <div class="field checkbox-field">
                <label>
                    <input type="checkbox" id="alsoZip">
                    <span>ALSO OUTPUT ORIGINAL ZIP LINKS <code>(archive.org/compress/…)</code></span>
                </label>
            </div>

            <div class="button-row">
                <button id="startBtn">▶ Extract URLs</button>
                <button id="stopBtn" disabled>■ Stop</button>
            </div>
        </div>

        <div class="status-box">
            <span id="statusMsg">Ready.</span><span id="statusDots"></span><span id="statusCount"></span>
        </div>

        <div class="results-section">
            <div class="results-header">
                <h2>RESULTS</h2>
                <span class="count-badge" id="countBadge">0 items</span>
            </div>
            <textarea id="resultArea" readonly placeholder="URLs will appear here in oldest-first order..."></textarea>
            <div class="download-buttons">
                <button id="copyBtn">Copy URLs</button>
                <button id="downloadBtn">⬇ Download .txt</button>
            </div>
        </div>
    </div>

    <script>
        const userInput   = document.getElementById('userInput');
        const mediaType   = document.getElementById('mediaType');
        const alsoZip     = document.getElementById('alsoZip');
        const startBtn    = document.getElementById('startBtn');
        const stopBtn     = document.getElementById('stopBtn');
        const countBadge  = document.getElementById('countBadge');
        const resultArea  = document.getElementById('resultArea');
        const copyBtn     = document.getElementById('copyBtn');
        const downloadBtn = document.getElementById('downloadBtn');

        // ── ドットアニメーション ──
        const DOT_CHARS = ['', '.', '..', '...'];
        let dotTimer = null, dotPhase = 0;
        function setMsg(text) { document.getElementById('statusMsg').textContent = text; }
        function startDots() {
            dotPhase = 0;
            document.getElementById('statusDots').textContent = DOT_CHARS[0];
            if (dotTimer) clearInterval(dotTimer);
            dotTimer = setInterval(() => {
                dotPhase = (dotPhase + 1) % 4;
                document.getElementById('statusDots').textContent = DOT_CHARS[dotPhase];
            }, 400);
        }
        function stopDots() {
            if (dotTimer) { clearInterval(dotTimer); dotTimer = null; }
            document.getElementById('statusDots').textContent = '';
        }
        function setCount(text) { document.getElementById('statusCount').textContent = text; }

        let isRunning       = false;
        let seenIds         = new Set();
        let detailLines     = [];
        let abortController = null;

        function renderResults() {
            const useZip = alsoZip.checked;
            resultArea.value = detailLines
                .map(u => useZip ? u.replace('/details/', '/compress/') : u)
                .join('\n');
            resultArea.scrollTop = resultArea.scrollHeight;
        }

        alsoZip.addEventListener('change', renderResults);

        startBtn.addEventListener('click', () => {
            if (isRunning) return;
            const input = userInput.value.trim();
            if (!input) { setMsg('Please enter an email or URL.'); return; }
            startFetch(input, mediaType.value);
        });

        stopBtn.addEventListener('click', () => {
            isRunning = false;
            if (abortController) abortController.abort();
            stopDots();
            setMsg(`※ Stopped: ${detailLines.length.toLocaleString()} items collected.`);
            setCount('');
            startBtn.disabled = false;
            stopBtn.disabled = true;
        });

        copyBtn.addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(resultArea.value);
                const orig = copyBtn.textContent;
                copyBtn.textContent = 'Copied!';
                setTimeout(() => copyBtn.textContent = orig, 1500);
            } catch (err) { alert('Copy failed: ' + err); }
        });

        downloadBtn.addEventListener('click', () => {
            const content = resultArea.value;
            if (!content.trim()) return;
            const blob = new Blob([content], { type: 'text/plain' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = alsoZip.checked ? 'archive_urls_compress.txt' : 'archive_urls.txt';
            a.click();
            URL.revokeObjectURL(a.href);
        });

        // ── メインフェッチ ──────────────────────────────────
        async function startFetch(input, mediatype) {
            countBadge.textContent = '0 items';
            isRunning = true;
            abortController = new AbortController();
            seenIds.clear();
            detailLines = [];
            resultArea.value = '';
            startBtn.disabled = true;
            stopBtn.disabled = false;
            setMsg('Resolving'); startDots();

            // Step 1: 入力解決
            let resolved;
            try {
                const res  = await fetch(`/resolve?user_input=${encodeURIComponent(input)}`);
                const data = await res.json();
                if (!res.ok || data.error) {
                    stopDots(); setMsg('Error: ' + (data.error || 'resolve failed')); setCount('');
                    startBtn.disabled = false; stopBtn.disabled = true; isRunning = false;
                    return;
                }
                resolved = data;  // {type, email} or {type, id, title}
            } catch (err) {
                stopDots(); setMsg('Error: ' + err.message); setCount('');
                startBtn.disabled = false; stopBtn.disabled = true; isRunning = false;
                return;
            }

            if (!isRunning) return;

            // Step 2: モード別バッチループ
            if (resolved.type === 'collection') {
                await fetchCollectionLoop(resolved, mediatype);
            } else {
                userInput.value = resolved.email;   // メール確定表示
                await fetchUploaderLoop(resolved.email, mediatype);
            }
        }

        // ── Uploader ループ（カーソルベース）───────────────
        async function fetchUploaderLoop(email, mediatype) {
            let cursor = null, count = 0, total = 0;

            while (isRunning) {
                let url = `/batch?mode=uploader&email=${encodeURIComponent(email)}&mediatype=${encodeURIComponent(mediatype)}`;
                if (cursor) url += `&cursor=${encodeURIComponent(cursor)}`;

                try {
                    const res  = await fetch(url, { signal: abortController.signal });
                    const data = await res.json();
                    if (!res.ok || data.error) throw new Error(data.error || 'HTTP ' + res.status);

                    if (total === 0 && data.total) total = data.total;
                    count = addItems(data.items, count);
                    updateUI(count, total, 'Fetching');

                    if (!data.has_more) { finalize(count); break; }
                    cursor = data.cursor;
                    await sleep(300);
                } catch (err) {
                    if (!isRunning) break;
                    await retryWait(err.message);
                }
            }
            finishRun(count);
        }

        // ── Collection ループ（ページベース）───────────────
        async function fetchCollectionLoop(resolved, mediatype) {
            let cursor = null, count = 0, total = 0;
            setMsg(`Collection: ${resolved.title}`); startDots();

            while (isRunning) {
                let url = `/batch?mode=collection&collection_id=${encodeURIComponent(resolved.id)}&mediatype=${encodeURIComponent(mediatype)}`;
                if (cursor) url += `&cursor=${encodeURIComponent(cursor)}`;

                try {
                    const res  = await fetch(url, { signal: abortController.signal });
                    const data = await res.json();
                    if (!res.ok || data.error) throw new Error(data.error || 'HTTP ' + res.status);

                    if (total === 0 && data.total) total = data.total;
                    count = addItems(data.items, count);
                    updateUI(count, total, `Collection: ${resolved.title}`);

                    if (!data.has_more) { finalize(count); break; }
                    cursor = data.cursor;
                    await sleep(300);
                } catch (err) {
                    if (!isRunning) break;
                    await retryWait(err.message);
                }
            }
            finishRun(count);
        }

        // ── ユーティリティ ──────────────────────────────────
        function addItems(items, count) {
            const newLines = [];
            for (const ident of items) {
                if (!isRunning) break;
                if (seenIds.has(ident)) continue;
                seenIds.add(ident);
                newLines.push(`https://archive.org/details/${ident}`);
                count++;
            }
            if (newLines.length) {
                detailLines.push(...newLines);
                renderResults();
            }
            return count;
        }

        function updateUI(count, total, msgPrefix) {
            const totalStr = total ? total.toLocaleString() : '?';
            countBadge.textContent = `${count.toLocaleString()} / ${totalStr} items`;
            setMsg(msgPrefix); startDots();
            setCount(`${count.toLocaleString()} / ${totalStr}`);
        }

        function finalize(count) {
            stopDots();
            setMsg(`✓ Complete: ${count.toLocaleString()} items`);
            setCount('');
        }

        function finishRun(count) {
            isRunning = false;
            startBtn.disabled = false;
            stopBtn.disabled = true;
            const msg = document.getElementById('statusMsg').textContent;
            if (!msg.startsWith('✓') && !msg.startsWith('※')) {
                stopDots();
                setMsg(`✓ Complete: ${seenIds.size.toLocaleString()} items`);
                setCount('');
            }
        }

        function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

        async function retryWait(errMsg) {
            stopDots();
            setMsg(`✗ ${errMsg}. Retrying in 5s…`);
            setCount('');
            await sleep(5000);
        }
    </script>
</body>
</html>
