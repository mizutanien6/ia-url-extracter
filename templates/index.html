<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA URL Extractor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>IA URL Extractor</h1>

        <div class="form-section">
            <div class="field">
                <label for="userInput">EMAIL ADDRESS OR ITEM URL</label>
                <input type="text" id="userInput" placeholder="mizutanien1@gmail.com">
            </div>

            <div class="field">
                <label for="mediaType">MEDIA TYPE</label>
                <select id="mediaType">
                    <option value="">All</option>
                    <option value="audio">Audio</option>
                    <option value="etree">Live Music (etree)</option>
                    <option value="movies">Movies</option>
                    <option value="texts">Texts</option>
                    <option value="software">Software</option>
                    <option value="image">Image</option>
                    <option value="data">Data</option>
                    <option value="web">Web</option>
                </select>
            </div>

            <div class="field checkbox-field">
                <label>
                    <input type="checkbox" id="alsoZip">
                    ALSO OUTPUT ORIGINAL ZIP LINKS&nbsp;( <code>archive.org/compress/…</code> )
                </label>
            </div>

            <div class="button-row">
                <button id="startBtn">▶ Extract URLs</button>
                <button id="stopBtn" disabled>■ Stop</button>
            </div>
        </div>

        <div class="status-box" id="statusText">Ready</div>

        <div class="results-section">
            <div class="results-header">
                <h2>RESULTS</h2>
                <span class="count-badge" id="countBadge">0 items</span>
            </div>
            <textarea id="resultArea" readonly></textarea>
            <div class="download-buttons">
                <button id="copyBtn">Copy URLs</button>
                <button id="downloadBtn">⬇ Download .txt</button>
            </div>
        </div>
    </div>

    <script>
        const userInput   = document.getElementById('userInput');
        const mediaType   = document.getElementById('mediaType');
        const alsoZip     = document.getElementById('alsoZip');
        const startBtn    = document.getElementById('startBtn');
        const stopBtn     = document.getElementById('stopBtn');
        const statusText  = document.getElementById('statusText');
        const countBadge  = document.getElementById('countBadge');
        const resultArea  = document.getElementById('resultArea');
        const copyBtn     = document.getElementById('copyBtn');
        const downloadBtn = document.getElementById('downloadBtn');

        let isRunning    = false;
        let seenIds      = new Set();
        let dotInterval  = null;

        // ── ドットアニメーション ──────────────────────────────
        function startDots(baseText) {
            let n = 0;
            const dots = ['.', '..', '...'];
            dotInterval = setInterval(() => {
                n = (n + 1) % 3;
                // baseTextの末尾の...を置換して更新
                statusText.textContent = baseText + dots[n];
            }, 400);
        }
        function stopDots() {
            if (dotInterval) { clearInterval(dotInterval); dotInterval = null; }
        }

        // ── ボタン ────────────────────────────────────────────
        startBtn.addEventListener('click', () => {
            if (isRunning) return;
            const input = userInput.value.trim();
            if (!input) { statusText.textContent = 'Please enter an email or item URL.'; return; }
            startFetch(input, mediaType.value);
        });

        stopBtn.addEventListener('click', () => {
            isRunning = false;
            stopDots();
            statusText.textContent = 'Stopped.';
            startBtn.disabled = false;
            stopBtn.disabled = true;
        });

        copyBtn.addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(resultArea.value);
                const orig = copyBtn.textContent;
                copyBtn.textContent = 'Copied!';
                setTimeout(() => copyBtn.textContent = orig, 1500);
            } catch (err) { alert('Copy failed: ' + err); }
        });

        // クライアント側Blobダウンロード（サイズ制限なし）
        downloadBtn.addEventListener('click', () => {
            const content = resultArea.value;
            if (!content.trim()) return;
            const blob = new Blob([content], { type: 'text/plain; charset=utf-8' });
            const url  = URL.createObjectURL(blob);
            const a    = document.createElement('a');
            a.href     = url;
            a.download = 'archive_urls.txt';
            a.click();
            URL.revokeObjectURL(url);
        });

        // ── メイン処理 ────────────────────────────────────────
        async function startFetch(input, mediatype) {
            isRunning = true;
            seenIds.clear();
            resultArea.value = '';
            startBtn.disabled = true;
            stopBtn.disabled = false;
            stopDots();
            statusText.textContent = 'Resolving uploader...';

            // Step 1: メール解決（1回だけ）
            let email = '';
            try {
                const res  = await fetch(`/resolve?user_input=${encodeURIComponent(input)}`);
                const data = await res.json();
                if (!res.ok || data.error) {
                    stopDots();
                    statusText.textContent = 'Error: ' + (data.error || 'resolve failed');
                    startBtn.disabled = false; stopBtn.disabled = true; isRunning = false;
                    return;
                }
                email = data.email;
                userInput.value = email;
            } catch (err) {
                stopDots();
                statusText.textContent = 'Error: ' + err.message;
                startBtn.disabled = false; stopBtn.disabled = true; isRunning = false;
                return;
            }

            if (!isRunning) return;

            // Step 2: バッチ取得ループ
            let cursor = null;
            let count  = 0;
            let total  = 0;

            while (isRunning) {
                let url = `/batch?email=${encodeURIComponent(email)}&mediatype=${encodeURIComponent(mediatype)}`;
                if (cursor) url += `&cursor=${encodeURIComponent(cursor)}`;

                try {
                    const res  = await fetch(url);
                    const data = await res.json();
                    if (!res.ok || data.error) throw new Error(data.error || 'HTTP ' + res.status);

                    if (total === 0 && data.total) total = data.total;

                    const lines = [];
                    for (const ident of data.items) {
                        if (!isRunning) break;
                        if (seenIds.has(ident)) continue;
                        seenIds.add(ident);
                        const detail = `https://archive.org/details/${ident}`;
                        lines.push(alsoZip.checked
                            ? detail + '\t' + `https://archive.org/compress/${ident}`
                            : detail);
                        count++;
                    }

                    if (lines.length) {
                        resultArea.value += (resultArea.value ? '\n' : '') + lines.join('\n');
                    }

                    const totalStr = total ? total.toLocaleString() : '?';
                    countBadge.textContent = `${count.toLocaleString()} / ${totalStr} items`;

                    if (!data.has_more) {
                        stopDots();
                        statusText.textContent = `Complete: ${count.toLocaleString()} items`;
                        break;
                    }

                    // ドットアニメーション更新
                    stopDots();
                    startDots(`Fetching… ${count.toLocaleString()} / ${totalStr} `);

                    cursor = data.cursor;
                    await new Promise(r => setTimeout(r, 300));

                } catch (err) {
                    if (!isRunning) break;
                    stopDots();
                    statusText.textContent = `Error: ${err.message}. Retrying in 5s…`;
                    await new Promise(r => setTimeout(r, 5000));
                }
            }

            isRunning = false;
            stopDots();
            startBtn.disabled = false;
            stopBtn.disabled = true;
            if (statusText.textContent.startsWith('Fetching')) {
                statusText.textContent = `Complete: ${seenIds.size.toLocaleString()} items`;
            }
        }
    </script>
</body>
</html>
